# =============================================================================
# Matplotlib Colormaps — Complete Reference with Hex Gradients (10-stop)
# 90 base colormaps × 2 (_r reversed) = 180 total
#
# Usage:
#   import yaml
#   import matplotlib.pyplot as plt
#
#   with open('cmap.yaml') as f:
#       cmaps = yaml.safe_load(f)['colormaps']
#
#   # Get a flat list of all names
#   all_names = [name for cat in cmaps.values() for name in cat['maps']]
#
#   # Get base names only (no _r)
#   base_names = [n for n in all_names if not n.endswith('_r')]
#
#   # Get names by category
#   diverging = list(cmaps['diverging']['maps'].keys())
#
#   # Get the 10-stop hex gradient for a cmap
#   hex_colors = cmaps['diverging']['maps']['RdBu']['gradient']
#
#   # Use directly in matplotlib
#   cmap = plt.get_cmap('viridis')
# =============================================================================

colormaps:

  # Perceptually uniform — recommended default for scientific / omics data
  perceptually_uniform_sequential:
    description: >
      Perceptually uniform sequential colormaps. Recommended default for scientific data. Colorblind-friendly, prints well in greyscale.
    recommended_for:
      - gene expression heatmaps
      - coverage/depth tracks
      - continuous scalar fields
      - publication figures (colorblind-safe)
    maps:
      viridis:
        gradient: ["#440154", "#482878", "#3e4989", "#31688e", "#26828e", "#1f9e89", "#35b779", "#6ece58", "#b5de2b", "#fde725"]
